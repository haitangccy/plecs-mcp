[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plecs-mcp"
version = "0.1.0"
description = "MCP server for PLECS Standalone XML-RPC automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
plecs-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "plecs_client"]
packages = ["tools"]
