[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "plecs-mcp"
version         = "0.2.0"
description     = "MCP Server for PLECS 4.7 Standalone"
requires-python = ">=3.10"
dependencies    = [
    "mcp[cli]>=1.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]

[project.scripts]
plecs-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
